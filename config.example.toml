# Copy to config.toml and edit.
projects = ["Sono", "Job search", "Personal", "Gaming"]
db_path = "timetracker.db"
sample_seconds = 5
idle_after_seconds = 120
block_minutes = 15
# Ollama on this machine. To use a model server later, point this at it.
ollama_url = "http://localhost:11434"
model = "qwen2.5:7b-instruct"
# JavaScript regexes stripped from window titles before they are stored.
redact = ['\S+@\S+']
