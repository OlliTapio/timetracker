name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows is where the tracker runs (and the sampler smoke test); Linux keeps the core portable.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting, types, lint (layers, FP, comments), tests + coverage, knip.
      - run: pnpm run check
