# Git hooks for everyone, human or agent. `pnpm install` installs them.
pre-commit:
  piped: true
  jobs:
    - name: prettier
      glob:
        - '*.{ts,json,md,yml,yaml}'
        - '**/*.{ts,json,md,yml,yaml}'
      exclude:
        - pnpm-lock.yaml
      run: npx prettier --write --log-level=warn {staged_files}
      stage_fixed: true
    - name: eslint
      glob:
        - '*.ts'
        - '**/*.ts'
      run: npx eslint --max-warnings=0 {staged_files}
    - name: typecheck
      run: npx tsc -p .

pre-push:
  jobs:
    - name: check
      run: npm run -s check
